name: ci

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/libialany/webapp
  CONFIG_REPO: libialany/argocd-course-webapp-config
  CHART_VALUES: helm/webapp/values.yaml

jobs:

  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}
      - name: Build and push image tagged with commit SHA
        run: |
          docker build -t "$IMAGE:${GITHUB_SHA}" .
          docker push "$IMAGE:${GITHUB_SHA}"

  update-config:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout config repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CONFIG_REPO }}
          ref: main
          token: ${{ secrets.GH_PAT }}
          path: config
      - name: Update image tag
        working-directory: config
        run: |
          yq -i '.image.repository = strenv(IMAGE) | .image.tag = strenv(GITHUB_SHA)' "$CHART_VALUES"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CHART_VALUES"
          git commit -m "chore(dev): webapp ${GITHUB_SHA}"
          git push
